name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
          - build-binaries
      version:
        description: 'Version to build (only for build-binaries, e.g., 0.1.1)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release-pr:
    name: Create Release PR
    if: github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.action, 'bump-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ inputs.action }}" in
            bump-major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            bump-minor)
              minor=$((minor + 1))
              patch=0
              ;;
            bump-patch)
              patch=$((patch + 1))
              ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping ${{ steps.current.outputs.version }} -> $NEW_VERSION"

      - name: Update Cargo.toml version
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.new.outputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo generate-lockfile

      - name: Generate changelog
        run: git cliff --tag "v${{ steps.new.outputs.version }}" -o CHANGELOG.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(release): prepare v${{ steps.new.outputs.version }}"
          branch: release/v${{ steps.new.outputs.version }}
          title: "release: v${{ steps.new.outputs.version }}"
          body: |
            Bumps version from ${{ steps.current.outputs.version }} to ${{ steps.new.outputs.version }}.

            **Changes included:**
            - Version bump in `Cargo.toml`
            - Updated `CHANGELOG.md` (auto-generated from commits)

            Once merged, pushing the tag `v${{ steps.new.outputs.version }}` will automatically:
            - Build binaries for Linux, macOS, Windows
            - Attach them to the GitHub Release

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Report versions
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $VERSION"
          echo "Release version: ${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false

  build-binaries:
    name: Build ${{ matrix.build_target }}
    needs: [create-release]
    if: |
      always() &&
      (needs.create-release.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build-binaries' && github.event.inputs.version != ''))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - build_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - build_target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - build_target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - build_target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - build_target: x86_64-apple-darwin
            os: macos-15-intel
          - build_target: aarch64-apple-darwin
            os: macos-latest
          - build_target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version || github.event.inputs.version }}

      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version || github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "no release version resolved" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && endsWith(matrix.build_target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build_target }}

      - name: Configure musl compiler
        if: runner.os == 'Linux' && endsWith(matrix.build_target, '-musl')
        shell: bash
        run: |
          cargo_target=$(echo '${{ matrix.build_target }}' | tr '[:lower:]-' '[:upper:]_')
          cc_target=$(echo '${{ matrix.build_target }}' | tr '-' '_')
          echo "CARGO_TARGET_${cargo_target}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${cc_target}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          TUICR_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --target ${{ matrix.build_target }}

      - name: Verify Linux binary linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary=target/${{ matrix.build_target }}/release/tuicr
          test "$("$binary" --version)" = "tuicr ${{ steps.version.outputs.version }}"
          if [[ '${{ matrix.build_target }}' == *-musl ]]; then
            if readelf -lW "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
              echo "musl release binary contains a dynamic interpreter" >&2
              readelf -lW "$binary" >&2
              exit 1
            fi
          elif ! readelf -lW "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            echo "GNU release binary is missing its dynamic interpreter" >&2
            readelf -lW "$binary" >&2
            exit 1
          fi

      - name: Package binary (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.build_target }}/release
          tar -czvf ../../../tuicr-${{ steps.version.outputs.version }}-${{ matrix.build_target }}.tar.gz tuicr

      - name: Package binary (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.build_target }}/release
          7z a ../../../tuicr-${{ steps.version.outputs.version }}-${{ matrix.build_target }}.zip tuicr.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            tuicr-*.tar.gz
            tuicr-*.zip
